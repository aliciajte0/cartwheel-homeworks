name: evals

on:
  push:
  pull_request:

jobs:
  offline-checks:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run checks that do not call a model
        run: uv run pytest tests/eval tests/test_cli.py tests/test_db.py tests/test_hw_holes.py tests/test_harbor_adapter.py tests/test_replay_harness.py -q

  complete-evaluations:
    name: Harbor evaluations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Generate seed data
        run: uv run python -m seed.generate

      - name: Install Harbor
        run: pip install harbor==0.23.0

      - name: Export Harbor tasks
        run: uv run python scripts/export_harbor_tasks.py

      - name: Run Harbor evaluations
        run: |
          harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "${CARTWHEEL_MODEL}" \
            -e docker \
            --n-attempts 5 \
            --job-name hw6-evals \
            --jobs-dir .harbor/jobs \
            --yes

      - name: Summarize results
        if: always()
        run: uv run python scripts/summarize_harbor_job.py --expected-attempts 5 .harbor/jobs/hw6-evals

      - name: Upload job artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-eval-results
          path: .harbor/jobs/hw6-evals/
